<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../reset.css" rel="stylesheet" />
    <link href="../global.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a href="/"><img src="../img/signiture.svg" /></a>
        <ul class="header__menu">
          {{HEADER_MENU}}
        </ul>
      </header>
      <div class="page">
        <h2 class="page-title">마이페이지</h2>

        <div class="profile_container">
          <div class="profile_box">
            <div class="profile_image">
                <img
                    class="profile"
                    id="profile-img"
                    src="{{PROFILE_IMAGE_URL}}"
                />

            </div>

            <input
                  type="file"
                  id="profile-image-input"
                  accept="image/*"
                  hidden
            />

            <div class="profile_frame">
              <div class="btn_profile">
                <div class="btn_container" id="profile-edit-btn">수정</div>
              </div>
              <div class="btn_bar"></div>
              <div class="btn_profile">
                <div class="btn_container" id="profile-delete-btn">삭제</div>
              </div>
            </div>
          </div>
        </div>

        <form class="form">
            <div class="textfield textfield_size_s input_margin">
              <p class="title_textfield">닉네임</p>
                <input
                    class="input_textfield"
                    name="name"
                    value="{{USER_NAME}}"
                    autocomplete="username"
                />
            </div>
            <div class="textfield textfield_size_s">
              <p class="title_textfield">비밀번호</p>
              <input
                class="input_textfield"
                placeholder="비밀번호를 변경할 경우 입력해주세요"
                autocomplete="current-password"
              />
            </div>
            <div class="textfield textfield_size_s">
              <p class="title_textfield">비밀번호 확인</p>
              <input
                class="input_textfield"
                type="password"
                placeholder="한 번 더 입력해주세요"
                autocomplete="current-password"
              />
            </div>
            <button
              id="registration-btn"
              class="btn btn_contained btn_size_m input_margin"

              type="button"
            >
              변경사항 저장
            </button>

        </form>
      </div>
    </div>
  </body>
</html>

<script>
  // 수정 버튼 → 파일 선택
  document.getElementById("profile-edit-btn")
    .addEventListener("click", () => {
      document.getElementById("profile-image-input").click();
    });

  // 파일 선택 후 업로드
  document.getElementById("profile-image-input")
    .addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("file", file);

      await fetch("/users/profile-image", {
        method: "POST",
        body: formData
      });

      location.reload();
    });

  // 삭제 버튼
  document.getElementById("profile-delete-btn")
    .addEventListener("click", async () => {
      if (!confirm("프로필 이미지를 삭제할까요?")) return;

      await fetch("/users/profile-image", {
        method: "DELETE"
      });

      location.reload();
    });
</script>
